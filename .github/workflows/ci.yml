name: REZS CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  agenttube-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agenttube
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agenttube/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:integration

  runtime-contract:
    runs-on: ubuntu-latest
    needs: agenttube-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          node --check agenttube/scripts/phase3c-real-smoke.js
          node --check agenttube/scripts/phase3f-publish.js
